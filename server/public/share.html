<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transmitir</title>
    <!-- ?v= existe porque share.js/css têm nome fixo. Quem abriu a página antes
         dos cabeçalhos no-store guardou a versão antiga por heurística do
         navegador, e continuaria usando ela para sempre. Trocar a query força
         uma URL nova. Incremente ao publicar mudanças nesses arquivos. -->
    <link rel="stylesheet" href="/share.css?v=26" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Transmitir</h1>
      </header>

      <!-- Erro que impede a página inteira: token inválido, navegador sem
           suporte. Os erros de cada fonte ficam no bloco dela. -->
      <p id="pageStatus" class="status" role="status"></p>

      <!-- Ajustes globais: valem para toda tela e para a câmera. Fora dos blocos
           de propósito — dá para escolher antes de começar e para corrigir com
           algo já no ar, que é quando o problema costuma aparecer. -->
      <div class="ajustes">
        <label>
          Qualidade
          <select id="qualidade">
            <option value="800000">Leve — 0,8 Mbps</option>
            <option value="1500000">Média — 1,5 Mbps</option>
            <option value="2500000">Boa — 2,5 Mbps</option>
            <option value="5000000">Alta — 5 Mbps</option>
            <option value="8000000">Máxima — 8 Mbps</option>
          </select>
        </label>
        <label>
          Quadros
          <select id="quadros">
            <option value="15">15 fps</option>
            <option value="30">30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </label>
      </div>

      <div id="fontes" class="fontes">
        <!-- Os blocos de tela entram aqui, antes da câmera. -->

        <section class="bloco" id="bloco-camera">
          <h2>Câmera</h2>

          <div class="js-setup">
            <div class="sem-preview js-vazio">Sem preview</div>
            <video class="js-previa" muted playsinline hidden></video>

            <div class="acao">
              <button class="primary js-start">Ligar a câmera</button>
              <button
                class="primary seta js-escolher"
                title="Escolher a câmera"
                aria-label="Escolher a câmera"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
              </button>

              <!-- Preenchido depois da permissão: antes dela o navegador entrega
                   os dispositivos sem nome, e uma lista de itens em branco não
                   ajuda ninguém a escolher. -->
              <ul class="menu js-menu" role="menu" hidden></ul>
            </div>
          </div>

          <div class="js-live" hidden>
            <div class="live-badge"><span class="dot"></span> No ar</div>
            <video class="js-preview" muted playsinline></video>
            <div class="stats">
              <div><strong class="js-viewers">0</strong><span>assistindo</span></div>
              <div><strong class="js-fps">—</strong><span>quadros</span></div>
              <div><strong class="js-bitrate">—</strong><span>enviando</span></div>
              <div><strong class="js-elapsed">00:00</strong><span>no ar</span></div>
            </div>
            <button class="danger js-stop">Desligar a câmera</button>
          </div>

          <p class="status js-status" role="status"></p>
        </section>

        <!-- Uma tela a mais, sem voltar à atividade. Escondido no teto. -->
        <button id="addTela" class="secondary add-tela" hidden>+ Compartilhar outra tela</button>
      </div>

      <footer>
        <p>Mantenha esta aba aberta enquanto transmite. Você pode voltar para o Discord — a transmissão continua.</p>
      </footer>
    </main>

    <!-- Molde de um bloco de tela. Clonado uma vez por tela compartilhada; os
         seletores internos são por classe (.js-*) para as cópias não colidirem
         em id, como colidiriam com os ids fixos de antes. -->
    <template id="tpl-tela">
      <section class="bloco bloco-tela">
        <h2 class="js-titulo">Tela</h2>

        <div class="js-setup">
          <div class="sem-preview js-vazio">Sem preview</div>
          <video class="js-previa" muted playsinline hidden></video>

          <p class="note js-nota">
            Marque "Compartilhar o áudio" na janela do navegador para levar o som.
          </p>

          <!-- A seta escolhe sem transmitir; o botão transmite o que estiver
               escolhido. Separados porque conferir o enquadramento e ir ao ar
               são decisões diferentes, e juntas não dá para voltar atrás diante
               de quem já está assistindo. -->
          <div class="acao">
            <button class="primary js-start">Escolher tela e transmitir</button>
            <button
              class="primary seta js-escolher"
              title="Ver outra tela antes de transmitir"
              aria-label="Ver outra tela antes de transmitir"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
            </button>
          </div>
        </div>

        <div class="js-live" hidden>
          <div class="live-badge"><span class="dot"></span> No ar</div>
          <video class="js-preview" muted playsinline></video>
          <div class="stats">
            <div><strong class="js-viewers">0</strong><span>assistindo</span></div>
            <div><strong class="js-fps">—</strong><span>quadros</span></div>
            <div><strong class="js-bitrate">—</strong><span>enviando</span></div>
            <div><strong class="js-elapsed">00:00</strong><span>no ar</span></div>
          </div>
          <button class="secondary js-somAba" hidden>Som de uma aba ou janela</button>
          <button class="danger js-stop">Parar de transmitir a tela</button>
        </div>

        <p class="status js-status" role="status"></p>
      </section>
    </template>

    <script type="module" src="/share.js?v=26"></script>
  </body>
</html>
